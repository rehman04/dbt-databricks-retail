# Third-party dbt packages — reusable macros/tests maintained outside this project.
# Run `dbt deps` to download these into dbt_packages/ (gitignored, like node_modules).
packages:
  # Utility macros: surrogate keys, date spines, pivoting, star(), union_relations, etc.
  - package: dbt-labs/dbt_utils
    version: [">=1.1.0", "<2.0.0"]

  # Extra generic tests inspired by the Python "Great Expectations" library —
  # e.g. expect_column_values_to_be_between, expect_table_row_count_to_be_between.
  # (metaplane/dbt_expectations is the current maintained namespace —
  # calogica/dbt_expectations is deprecated as of dbt 1.10.)
  - package: metaplane/dbt_expectations
    version: [">=0.10.0", "<0.11.0"]
